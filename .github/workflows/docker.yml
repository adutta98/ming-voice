# Docker images for each release: <owner>/ming-voice:cuda and :rocm (also tagged with the version) on Docker Hub
# and ghcr.io. Docker Hub needs a DOCKERHUB_TOKEN secret (an access token with write access); without one, only
# ghcr.io gets them.
name: Docker images
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gpu: nvidia, flavor: cuda }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >>"$GITHUB_OUTPUT"
      - name: Tags
        id: tags
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          imgs=(ghcr.io/$owner/ming-voice)
          hub=${DOCKERHUB_USERNAME:-$owner}
          [ -n "$DOCKERHUB_TOKEN" ] && imgs+=(docker.io/${hub,,}/ming-voice)
          # every build: the moving tags + one pinned per version, so an update always says which
          # image it pulled (the server reports the same version in /api/health and session.created)
          tags=
          for img in "${imgs[@]}"; do
            tags=$tags,$img:${{ matrix.flavor }},$img:${{ matrix.flavor }}-$VER,$img:$VER-${{ matrix.flavor }}
            [ "${{ github.event_name }}" = release ] && tags=$tags,$img:${GITHUB_REF_NAME#v}-${{ matrix.flavor }}
          done
          echo "tags=${tags#,}" >>"$GITHUB_OUTPUT"
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          VER: ${{ steps.ver.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # one KEY=VALUE per line: build-push-action treats a single line as one (malformed) arg
          build-args: |
            GPU=${{ matrix.gpu }}
            MING_VERSION=${{ steps.ver.outputs.version }}
            MING_GIT_REVISION=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
